name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/setup-bmad-webapp-y1nOA]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          VITE_SA_CLIENT_EMAIL: ${{ secrets.VITE_SA_CLIENT_EMAIL }}
          VITE_SA_PRIVATE_KEY_B64: ${{ secrets.VITE_SA_PRIVATE_KEY_B64 }}

      - name: Copy index.html as 404.html for SPA routing
        run: cp dist/404.html dist/404.html 2>/dev/null || cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
